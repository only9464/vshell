name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build (server)
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (server)
        run: go test ./... -count=1

      - name: Test (agent)
        working-directory: agent
        run: |
          go build ./...
          go test ./... -count=1

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: End-to-end (HTTP + KCP)
        run: ./scripts/e2e.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/vshell-e2e.*/**/*.log
          if-no-files-found: ignore
